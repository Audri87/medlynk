# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Workspace Port auto-discovery via service tags
    _instanceof:
        App\Shared\Application\Port\Workspace\WorkspaceContributor:
            tags: ['medlink.workspace.contributor']
        App\Shared\Application\Port\Workspace\AttentionProvider:
            tags: ['medlink.attention.provider']
        App\Shared\Application\Port\Workspace\WorkItemProvider:
            tags: ['medlink.work_item.provider']

    App\Platforms\Clinical\Application\WorkspaceAssembler:
        arguments:
            $contributors: !tagged_iterator medlink.workspace.contributor
            $attentionProviders: !tagged_iterator medlink.attention.provider
            $workItemProviders: !tagged_iterator medlink.work_item.provider

    # Domain Event Pipeline — ADR-SA-013
    App\Shared\Application\Port\DomainEventCollectorPort:
        alias: App\Shared\Infrastructure\Messenger\DomainEventCollector

    App\Shared\Application\Port\OutboxWriterPort:
        alias: App\Shared\Infrastructure\Persistence\OutboxRepository

    App\Shared\Application\Port\CorrelationIdProviderPort:
        alias: App\Shared\Infrastructure\Http\CorrelationIdContextAdapter

    App\Shared\Infrastructure\Eventing\EventTypeResolver:
        factory: ['App\Platforms\Clinical\Infrastructure\Eventing\ClinicalEventTypeRegistry', 'createResolver']

    App\Shared\Infrastructure\Eventing\EventEnvelopeFactory:
        arguments:
            $platformId: 'clinical'

    # Facade bus wiring
    App\Platforms\Clinical\Application\ClinicalContributionFacade:
        arguments:
            $commandBus: '@command.bus'
            $queryBus: '@query.bus'
